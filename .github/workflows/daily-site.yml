name: Check public intake sources and publish vetted directory
on:
  push:
    branches: [main]
    paths:
      - 'data/clinics.json'
      - 'data/review_history.json'
      - 'data/extra_communities.json'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '17 8 * * *'
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      clinic_edit:
        description: 'Paste the reviewed edit code from the site (leave empty for research only)'
        required: false
        type: string
      confirmation:
        description: 'To save an edit, type PUBLISH followed by its clinic ID (e.g. PUBLISH c011)'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: public-primary-care-site
  cancel-in-progress: false
jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply explicitly confirmed site edit
        if: github.event_name == 'workflow_dispatch' && inputs.clinic_edit != ''
        env:
          CLINIC_EDIT: ${{ inputs.clinic_edit }}
          EDIT_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/apply_site_edit.py
      - name: Check official clinic sources and discover possible new leads
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clinic_edit == '') || contains(github.event.head_commit.message, '[full-audit]')
        run: |
          python scripts/check_sources.py
          python scripts/discover_clinics.py
          python scripts/directory_discovery.py
          python scripts/registry_audit.py
          python scripts/official_registry.py
          python scripts/auto_publish.py
      - name: Optional AI triage of PUBLIC leads (never edits intake statuses)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clinic_edit == '')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
          OPENAI_MAX_TRIAGE: '6'
        run: python scripts/ai_triage.py
      - name: Validate database and create Word/PDF/map from published records only
        run: |
          python scripts/validate.py
          python scripts/build.py
      - name: Run offline functional, privacy and evidence tests
        run: |
          python tests/reliability_test.py
          python tests/live_publication_test.py
          node tests/freshness_test.cjs
          python tests/monitor_fixture_test.py
          python tests/source_recovery_test.py
          python tests/schedule_watchdog_test.py
          python tests/discovery_fixture_test.py
          python tests/directory_discovery_fixture_test.py
          python tests/auto_publication_test.py
          python tests/evidence_policy_test.py
          python tests/inventory_integrity_test.py
          python tests/approval_fixture_test.py
          python tests/site_edit_test.py
          node tests/site_js_smoke.cjs
      - name: Create one GitHub review issue for NEW findings, if any
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clinic_edit == '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/review_notices.py --prepare | tee /tmp/review-summary.txt
          count=$(sed -n 's/^notice_count=//p' /tmp/review-summary.txt)
          if [ "${count:-0}" -gt 0 ]; then
            if gh issue create \
              --title "Primary care research: ${count} item(s) to verify" \
              --body-file review-notice.md; then
              python scripts/review_notices.py --mark-notified
            else
              echo 'Warning: Review issue could not be created. Leads remain in JSON and can be reported later.'
            fi
          fi
      - name: Save monitored evidence and confidently auto-published changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-audit]')
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/clinics.json data/review_history.json data/extra_communities.json \
            data/official_registry_state.json data/source_state.json data/review_queue.json \
            data/discovery_state.json data/discovery_queue.json \
            data/directory_state.json data/directory_queue.json \
            data/registry_audit_state.json data/registry_audit_queue.json \
            data/triage_state.json data/notification_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified public-source changes and research leads'
            git push
          fi
      - name: Preserve source-check diagnostics even when later steps fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/source_state.json
            data/discovery_state.json
            data/directory_state.json
            data/official_registry_state.json
            data/review_queue.json
            data/discovery_queue.json
            data/directory_queue.json
      - name: Record trigger and actual source coverage
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          echo "## Run trigger: $RUN_EVENT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment success is not a successful source check or verified intake.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python scripts/monitor_health.py >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed website, report, Word and PDF are live and synchronized
        if: steps.deployment.outcome == 'success'
        run: |
          python scripts/verify_live_publication.py \
            --base-url 'https://shunterneo.github.io/regional-primary-care-availability/' \
            --site-dir site
